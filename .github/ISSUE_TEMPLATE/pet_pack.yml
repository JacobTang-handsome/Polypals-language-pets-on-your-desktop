name: Pet pack submission
description: Propose a validated declarative pet pack
body:
  - type: input
    attributes: { label: Pack and pet IDs }
    validations: { required: true }
  - type: textarea
    attributes: { label: Sprite v2 QA and asset license }
    validations: { required: true }
  - type: checkboxes
    attributes:
      label: Rights and validation
      options:
        - label: I have redistribution rights and the complete pack passes validate-pack.
          required: true
