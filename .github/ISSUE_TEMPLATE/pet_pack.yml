name: Pet pack submission
description: Propose a validated declarative pet pack
body:
  - type: input
    id: pack_identity
    attributes:
      label: Pack and pet IDs
    validations:
      required: true
  - type: textarea
    id: qa_and_license
    attributes:
      label: Sprite v2 QA and asset license
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights and validation
      options:
        - label: I have redistribution rights and the complete pack passes validate-pack.
          required: true
