name: 功能建议（中文）
description: 提出范围明确的产品改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 这个功能希望解决什么实际问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议体验
      description: 请描述理想的操作流程或结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 是否考虑过其他解决方式？
  - type: textarea
    id: privacy_compatibility
    attributes:
      label: 隐私与兼容性
      description: 请说明可能涉及的数据、权限、macOS 兼容性或迁移影响。
