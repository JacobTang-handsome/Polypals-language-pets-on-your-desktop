name: Content pack submission
description: Propose a validated declarative content pack
body:
  - type: input
    id: pack_identity
    attributes:
      label: Pack ID and version
    validations:
      required: true
  - type: textarea
    id: scope_and_license
    attributes:
      label: Languages, CEFR levels, sources, and license
    validations:
      required: true
  - type: checkboxes
    id: validation
    attributes:
      label: Validation
      options:
        - label: The example validator passes and all dialogue is original or licensed.
          required: true
